[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/admin/index.html"
  to = "/admin"
  status = 301

[[redirects]]
  from = "/services"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/packages"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/how-it-works"
  to = "/about"
  status = 301

[[redirects]]
  from = "/faqs"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/for-referrers"
  to = "/contact"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
